name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Production dependencies only — remaining highs are dev-only
      # (braces chain inside eslint-config-next tooling).
      - run: npm audit --omit=dev --audit-level=high
      # Full audit as informational (does not block).
      - run: npm audit --audit-level=critical
        continue-on-error: true
